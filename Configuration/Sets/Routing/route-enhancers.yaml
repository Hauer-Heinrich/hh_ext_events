  ### Use this if you use a detail-plugin on a page
  EventPluginDetail:
    type: Extbase
    extension: HhExtEvents
    plugin: Eventdetail
    defaultController: 'Event::show'
    routes:
      - routePath: '/{slug}'
        _controller: 'Event::show'
        _arguments:
          slug: event
    aspects:
      slug:
        type: PersistedAliasMapper
        tableName: tx_hhextevents_domain_model_event
        routeFieldName: slug
